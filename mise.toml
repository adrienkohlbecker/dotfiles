# Repo-local mise tasks for the GNU stow symlinks this repo deploys into $HOME.
# Run them from anywhere inside the repo (dir is pinned to the repo root); `*/`
# targets every package dir. stow itself comes from brew (mac) / apt (fleet),
# not mise. This file lives at the repo root and is NOT a stow package — it's
# repo tooling, never symlinked into $HOME.

# The gnupg package deploys ~/.gnupg; stow creates that dir with the default
# umask, but gpg refuses (and warns about) a homedir with group/other access, so
# tighten it to 0700 after linking. The operator's public key
# (gpg_public_key.asc, repo tooling like this file) is then imported so hosts
# that only receive a forwarded gpg-agent can verify and encrypt; re-importing
# an unchanged key is a no-op.
#
# Most packages use --no-folding so shared trees like ~/.config stay real
# directories. The agents package allows folding so ~/.agents/skills/<skill> is
# a symlinked skill directory, which Codex discovers correctly.
#
# Stow skips ~/.codex/config.toml (the Codex app replaces that symlink when it
# rewrites the file); codex_config_sync merges the managed block in instead.
#
# `notes/` is not a package: it's the gitignored link to this repo's private
# notes (project_notes), which agents/.agents/notes points at so they deploy as
# ~/.agents/notes. Every loop skips it, or stow would scatter them into $HOME.

[tasks.test]
description = "Run the csearch helper's regression tests"
dir = "{{ config_root }}"
run = "python3 -B -m unittest test_claude_search"

[tasks.stow]
description = "Link all packages into $HOME (adds new files)"
dir = "{{ config_root }}"
run = [
  "for package in */; do case $package in agents/ | notes/) ;; *) stow --target=$HOME --no-folding --verbose \"$package\" ;; esac; done",
  "stow --target=$HOME --verbose agents/",
  "./bin/.local/bin/codex_config_sync",
  "mkdir -p $HOME/.gnupg && chmod 700 $HOME/.gnupg",
  "if command -v gpg >/dev/null; then gpg --batch --quiet --import {{ config_root }}/gpg_public_key.asc; fi",
]

[tasks.restow]
description = "Re-link all packages — cleans stale links after deletes/renames"
dir = "{{ config_root }}"
run = [
  "for package in */; do case $package in agents/ | notes/) ;; *) stow --target=$HOME --no-folding --restow --verbose \"$package\" ;; esac; done",
  "stow --target=$HOME --restow --verbose agents/",
  "./bin/.local/bin/codex_config_sync",
  "mkdir -p $HOME/.gnupg && chmod 700 $HOME/.gnupg",
  "if command -v gpg >/dev/null; then gpg --batch --quiet --import {{ config_root }}/gpg_public_key.asc; fi",
]

[tasks.unstow]
description = "Remove all of this repo's symlinks from $HOME"
dir = "{{ config_root }}"
run = "for package in */; do [ \"$package\" = notes/ ] || stow --target=$HOME --delete --verbose \"$package\"; done"
