# Dotfiles-managed Codex preferences. Stow does not link this file: the Codex
# app replaces the symlink whenever it rewrites ~/.codex/config.toml, and it
# keeps local state there too (project trust, hook hashes, marketplaces, app MCP
# wiring). `codex_config_sync`, run by `mise run stow`, merges the marked block
# below into the live config and leaves everything outside it alone; its
# docstring covers how app edits inside the block are handled.

# BEGIN dotfiles-managed Codex config
approvals_reviewer = "user"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "default"
plan_mode_reasoning_effort = "xhigh"
sandbox_mode = "danger-full-access"
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true
writable_roots = [
    "~/.local/share/mise",
    "~/.local/state/mise",
    "~/Library/Caches",
    "~/.cache",
    "~/.ansible",
    "~/.ssh",
    ".git",
    "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Home/Code",
    "~/.local/share/project_notes",
]

[tui]
terminal_title = ["activity", "project-name", "run-state"]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "git-branch",
    "branch-changes",
    "run-state",
    "permissions",
    "approval-mode",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit",
    "task-progress",
]
status_line_use_colors = true
theme = "dracula"
pet = "rocky"

[features]
terminal_resize_reflow = true
memories = true
js_repl = false
codex_git_commit = true

[plugins]

[plugins."github@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
show-context-window-usage = true

[notice]
hide_full_access_warning = true
# END dotfiles-managed Codex config
